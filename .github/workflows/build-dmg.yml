name: Build macOS DMG

permissions:
  contents: write

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run build script
        run: |
          chmod +x build_app.sh
          ./build_app.sh

      - name: Install the certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          # Create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Import certificate from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          # Create temporary keychain
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH

          # Import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Sign and Notarize Application
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          APP_PATH="dist/Interactive Model Training.app"
          DMG_PATH="dist/Interactive Model Training.dmg"
          IDENTITY="Developer ID Application: ROBERT STANLEY ALELYUNAS ($APPLE_TEAM_ID)"

          echo "Signing inner frameworks, libraries, and executables..."
          # Find and sign all dylibs, frameworks, and helper executables inside the app first
          find "$APP_PATH/Contents" -type f \( -name "*.dylib" -o -name "*.so" -o -name "*.framework" -o -name "*.app" \) | while read -r file; do
            codesign --force --options runtime --timestamp --sign "$IDENTITY" "$file" || true
          done

          # If your app bundles a Python executable or helpers, ensure they are signed
          if [ -d "$APP_PATH/Contents/MacOS" ]; then
            for file in "$APP_PATH/Contents/MacOS/"*; do
              if [ -f "$file" ]; then
                codesign --force --options runtime --timestamp --sign "$IDENTITY" "$file"
              fi
            done
          fi

          echo "Signing the main app bundle..."
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$APP_PATH"

          echo "Signing the DMG..."
          codesign --force --timestamp --sign "$IDENTITY" "$DMG_PATH"

          echo "Submitting to Apple Notary Service..."
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          echo "Stapling notarization ticket..."
          xcrun stapler staple "$DMG_PATH"

      - name: Upload DMG to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Interactive\ Model\ Training.dmg
          tag_name: v1.0.${{ github.run_number }}
          name: "Interactive Model Training v1.0.${{ github.run_number }}"
          body: "Automated signed and notarized build generated from commit ${{ github.sha }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}